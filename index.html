<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0f1724">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2026-10-14-16">
<link rel="icon" href="icons/icon-192.png?v=2026-10-14-16">
<style>
  :root {
    --bg: #0f1724;
    --bg-elevated: #172235;
    --bg-elevated-2: #1d2b42;
    --border: #2a3a52;
    --text: #edf4ff;
    --text-dim: #a9b8ce;
    --text-faint: #8192ab;
    --accent: #66a8ff;
    --accent-ink: #081729;
    --accent-dim: #4387df;
    --grid-line: rgba(220, 235, 255, 0.1);
    --fill-top: rgba(102, 168, 255, 0.26);
    --fill-bottom: rgba(102, 168, 255, 0);
    --good: #7fceaa;
    --warn: #f09a87;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    overscroll-behavior-y: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  button { font-family: inherit; }
  input { font-family: inherit; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: calc(18px + env(safe-area-inset-top)) 18px 10px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand h1 {
    font-size: 1.375rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .brand .today {
    font-size: 0.8125rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .primary-nav {
    display: flex;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .primary-tab {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.8125rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0 0 10px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .primary-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .day-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .day-tab {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 9px 4px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .day-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .day-subtitle {
    padding: 14px 18px 4px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }

  main.main-pad {
    flex: 1;
    padding: 6px 18px calc(32px + env(safe-area-inset-bottom));
  }
  .workout-progress { margin: 8px 0 14px; }
  .workout-progress-heading {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 7px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .workout-progress-heading span:first-child {
    font-weight: 700;
    color: var(--text);
  }
  .progress-track {
    height: 5px;
    overflow: hidden;
    background: var(--border);
    border-radius: 999px;
  }
  .progress-fill {
    width: 0;
    height: 100%;
    background: var(--accent);
    border-radius: inherit;
    transition: width 0.2s ease;
  }
  .ex-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .ex-logged {
    flex-shrink: 0;
    color: var(--good);
    font-size: 0.6875rem;
    font-weight: 700;
  }
  #exerciseList {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #coachView {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .coach-date {
    font-size: 0.8125rem;
    color: var(--text-faint);
  }
  .coach-summary {
    display: flex;
    gap: 8px;
  }
  .summary-chip {
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }
  .summary-chip .num {
    display: block;
    font-size: 1.375rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .summary-chip .lbl {
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
  }
  .coach-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .coach-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .coach-ex-name { font-weight: 700; font-size: 0.9375rem; }
  .pill {
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 20px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .pill.pr { background: var(--accent); color: var(--accent-ink); }
  .pill.up { background: rgba(143, 179, 107, 0.18); color: var(--good); }
  .pill.down { background: rgba(201, 122, 99, 0.18); color: var(--warn); }
  .pill.same, .pill.first { background: var(--border); color: var(--text-dim); }
  .coach-msg { font-size: 0.8125rem; color: var(--text-dim); line-height: 1.4; }
  .coach-fatigue { font-size: 0.75rem; color: var(--warn); }
  .coach-empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.875rem;
    padding: 40px 12px;
  }
  .weekly-report {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 14px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .weekly-report-title { margin: 0; font-size: 1rem; font-weight: 800; }
  .weekly-report-note { margin: 0; color: var(--text-faint); font-size: 0.75rem; line-height: 1.4; }
  .weekly-report-summary { display: flex; gap: 8px; }
  .weekly-report-summary .summary-chip { min-width: 0; }
  .weekly-report-summary .summary-chip .num { font-size: 1.125rem; }
  .weekly-insight { font-size: 0.8125rem; line-height: 1.45; color: var(--text-dim); }
  .weekly-exercises { display: flex; flex-direction: column; gap: 8px; }
  .weekly-exercise {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .weekly-exercise .coach-msg { font-size: 0.75rem; }
  .workout-calendar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .calendar-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .calendar-title { margin: 0; font-size: 1rem; font-weight: 800; }
  .calendar-nav { display: flex; gap: 6px; }
  .calendar-nav-btn {
    appearance: none;
    width: 36px;
    height: 36px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
  }
  .calendar-nav-btn:disabled { opacity: 0.4; cursor: default; }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }
  .calendar-weekday {
    padding: 4px 0;
    color: var(--text-faint);
    font-size: 0.625rem;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
  }
  .calendar-day {
    position: relative;
    display: flex;
    min-width: 0;
    min-height: 38px;
    align-items: center;
    justify-content: center;
    appearance: none;
    background: var(--bg-elevated);
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text-dim);
    font: inherit;
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .calendar-day:disabled { background: transparent; cursor: default; }
  .calendar-day.has-workout::after {
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--good);
    content: "";
  }
  .calendar-day.selected {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 800;
  }
  .calendar-day.selected.has-workout::after { background: currentColor; }
  .calendar-day.today:not(.selected) { border-color: var(--accent-dim); }
  .calendar-day:focus-visible, .calendar-nav-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .calendar-legend { color: var(--text-faint); font-size: 0.6875rem; }
  .calendar-day-summary {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .calendar-day-summary h3 { margin: 0; font-size: 0.8125rem; }
  .calendar-session {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
  .calendar-session-detail { color: var(--text-faint); text-align: right; }

  .backup-box {
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .backup-box textarea {
    width: 100%;
    min-height: 70px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    resize: vertical;
  }
  .backup-row { display: flex; gap: 8px; }
  .backup-btn {
    appearance: none;
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 700;
    font-size: 0.8125rem;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .backup-btn:active { background: var(--bg-elevated-2); }
  .backup-note {
    font-size: 0.75rem;
    color: var(--text-faint);
  }

  .ex-card {
    appearance: none;
    text-align: left;
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .ex-card:active { background: var(--bg-elevated-2); }
  .ex-main { flex: 1; min-width: 0; }
  .ex-name {
    font-size: 1.0625rem;
    font-weight: 700;
    margin: 0 0 2px;
  }
  .ex-target {
    font-size: 0.8125rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .ex-stat {
    text-align: right;
    flex-shrink: 0;
  }
  .ex-stat .val {
    font-size: 0.9375rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .ex-stat .lbl {
    font-size: 0.6875rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .spark { display: block; margin-top: 4px; }
  .chevron {
    color: var(--text-faint);
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  /* Detail sheet */
  .sheet {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: stretch;
    pointer-events: none;
  }
  .sheet-inner {
    width: 100%;
    max-width: 480px;
    height: 100%;
    background: var(--bg);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sheet.open { pointer-events: auto; }
  .sheet.open .sheet-inner { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .sheet-inner { transition: none; }
    .progress-fill { transition: none; }
  }

  .sheet-top {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top)) 18px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2;
  }
  .back-btn {
    appearance: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    font-size: 1.05rem;
    cursor: pointer;
  }
  .sheet-title h2 {
    margin: 0;
    font-size: 1.1875rem;
    font-weight: 800;
  }
  .sheet-title .target {
    font-size: 0.8125rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .sheet-body { padding: 16px 18px calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 26px; }

  .detail-accordion {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-elevated);
    overflow: hidden;
  }
  .detail-accordion > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px;
    margin: 0;
    cursor: pointer;
    list-style: none;
    color: var(--text-dim);
  }
  .detail-accordion > summary::-webkit-details-marker { display: none; }
  .detail-accordion > summary::after {
    content: "›";
    color: var(--text-faint);
    font-size: 1.25rem;
    transform: rotate(90deg);
  }
  .detail-accordion[open] > summary::after { transform: rotate(-90deg); }
  .detail-accordion > summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .accordion-content { padding: 0 10px 10px; }

  .section-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin: 0 0 10px;
  }

  .set-table { display: flex; flex-direction: column; gap: 8px; }
  .set-head, .set-row {
    display: grid;
    grid-template-columns: 44px 1fr 1fr;
    gap: 10px;
    align-items: center;
  }
  .set-row.time-row { grid-template-columns: 44px 1fr; }
  .set-head span {
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }
  .set-num {
    font-size: 0.9375rem;
    font-weight: 700;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .set-row input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 10px;
    font-size: 1rem;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .set-row input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .rest-timer {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
    padding: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .rest-timer-info {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .rest-timer-label {
    color: var(--text-faint);
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .rest-timer-display {
    color: var(--text);
    font-size: 1.375rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .rest-timer-status {
    min-height: 1em;
    color: var(--text-faint);
    font-size: 0.6875rem;
  }
  .rest-timer-controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }
  .rest-timer-btn {
    appearance: none;
    min-height: 38px;
    padding: 7px 8px;
    background: var(--bg-elevated-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .rest-timer-btn:disabled { opacity: 0.45; cursor: default; }
  .rest-timer-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .entry-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .save-btn {
    appearance: none;
    flex: 2;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 800;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .save-btn:active { background: var(--accent-dim); }
  .reset-btn {
    appearance: none;
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 0.9375rem;
    font-weight: 700;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--bg-elevated-2); }
  .save-note {
    text-align: center;
    font-size: 0.8125rem;
    color: var(--text-faint);
    margin-top: 8px;
    height: 1em;
  }

  .chart-wrap {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 8px 10px;
  }
  .chart-empty {
    padding: 26px 12px;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.875rem;
  }

  .history-list { display: flex; flex-direction: column; }
  .history-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.8125rem;
  }
  .history-row:last-child { border-bottom: none; }
  .history-del {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 1rem;
    line-height: 1;
    padding: 4px 0 4px 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .history-del:active { color: var(--warn); }
  .history-date {
    color: var(--text-dim);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .history-sets {
    flex: 1;
    color: var(--text-faint);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .empty-hint {
    color: var(--text-faint);
    font-size: 0.8125rem;
  }

  a, a:visited { color: var(--accent); }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">
      <h1>Gym Log</h1>
      <div class="today" id="todayLabel"></div>
    </div>
    <div class="primary-nav" id="primaryNav">
      <button class="primary-tab active" data-view="log" type="button">Log</button>
      <button class="primary-tab" data-view="coach" type="button">Coach</button>
      <button class="primary-tab" data-view="calendar" type="button">Calendar</button>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
  </header>
  <div class="day-subtitle" id="daySubtitle"></div>
  <main class="main-pad">
    <div class="workout-progress" id="workoutProgress">
      <div class="workout-progress-heading">
        <span>Workout progress</span>
        <span id="workoutProgressLabel"></span>
      </div>
      <div class="progress-track" id="workoutProgressTrack" role="progressbar" aria-label="Today's workout progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="progress-fill" id="workoutProgressFill"></div>
      </div>
    </div>
    <div id="exerciseList"></div>
    <div id="coachView" style="display:none;"></div>
    <div id="calendarView" style="display:none;"></div>
  </main>

  <div class="sheet" id="sheet">
    <div class="sheet-inner">
      <div class="sheet-top">
        <button class="back-btn" id="backBtn" aria-label="Back">&larr;</button>
        <div class="sheet-title">
          <h2 id="sheetName"></h2>
          <div class="target" id="sheetTarget"></div>
        </div>
      </div>
      <div class="sheet-body">
        <div>
          <p class="section-label">Log today</p>
          <div class="set-table" id="setTable"></div>
          <div class="rest-timer">
            <div class="rest-timer-info">
              <span class="rest-timer-label">Rest timer</span>
              <span class="rest-timer-display" id="restTimerDisplay" role="timer" aria-live="off">0:40</span>
            </div>
            <div class="rest-timer-status" id="restTimerStatus" aria-live="polite">Choose your rest</div>
            <div class="rest-timer-controls">
              <button class="rest-timer-btn primary" id="restTimerSet" type="button">Between sets · 0:40</button>
              <button class="rest-timer-btn primary" id="restTimerExercise" type="button">Between exercises · 2:00</button>
              <button class="rest-timer-btn" id="restTimerToggle" type="button" disabled>Pause</button>
              <button class="rest-timer-btn" id="restTimerReset" type="button" aria-label="Reset rest timer">↺ Reset</button>
            </div>
          </div>
          <div class="entry-actions">
            <button class="save-btn" id="saveBtn" type="button">Save session</button>
            <button class="reset-btn" id="resetBtn" type="button">Reset</button>
          </div>
          <div class="save-note" id="saveNote"></div>
        </div>
        <details class="detail-accordion" id="progressDetails">
          <summary class="section-label">Progress</summary>
          <div class="accordion-content">
            <div class="chart-wrap" id="chartWrap"></div>
          </div>
        </details>
        <details class="detail-accordion">
          <summary class="section-label">History</summary>
          <div class="accordion-content">
            <div class="history-list" id="historyList"></div>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ROUTINE = {
    Monday: {
      subtitle: "Upper Body — Push",
      exercises: [
        { id: "mon-chest-press", name: "Chest Press Machine", sets: 4, reps: 8, type: "weight" },
        { id: "mon-incline-chest-press", name: "Incline Chest Press Machine", sets: 3, reps: 10, type: "weight" },
        { id: "mon-overhead-press", name: "Overhead Press", sets: 3, reps: 10, type: "weight" },
        { id: "mon-lateral-raise", name: "Lateral Raise", sets: 3, reps: 15, type: "weight" },
        { id: "mon-triceps-pushdown", name: "Triceps Pushdown", sets: 3, reps: 12, type: "weight" },
        { id: "mon-hanging-leg-raise", name: "Hanging Leg Raise", sets: 3, reps: 12, type: "weight" }
      ]
    },
    Tuesday: {
      subtitle: "Lower Body — Quads",
      exercises: [
        { id: "tue-hack-squat", name: "Hack Squat Machine", sets: 4, reps: 8, type: "weight" },
        { id: "tue-leg-press", name: "Leg Press", sets: 3, reps: 12, type: "weight" },
        { id: "tue-leg-extension", name: "Leg Extension", sets: 3, reps: 12, type: "weight" },
        { id: "tue-standing-calf-raise", name: "Standing Calf Raise", sets: 3, reps: 15, type: "weight" },
        { id: "tue-plank", name: "Plank", sets: 3, reps: 45, type: "time" }
      ]
    },
    Wednesday: {
      subtitle: "Upper Body — Pull",
      exercises: [
        { id: "wed-chest-supported-row", name: "Chest Supported Row Machine", sets: 4, reps: 8, type: "weight" },
        { id: "wed-lat-pulldown", name: "Lat Pulldown", sets: 3, reps: 10, type: "weight" },
        { id: "wed-cable-row", name: "Cable Row", sets: 3, reps: 12, type: "weight" },
        { id: "wed-barbell-curl", name: "Barbell Curl", sets: 3, reps: 10, type: "weight" },
        { id: "wed-overhead-triceps-ext", name: "Overhead Triceps Extension", sets: 3, reps: 12, type: "weight" },
        { id: "wed-cable-crunch", name: "Cable Crunch", sets: 3, reps: 15, type: "weight" }
      ]
    },
    Thursday: {
      subtitle: "Lower Body — Posterior",
      exercises: [
        { id: "thu-lying-leg-curl", name: "Lying Leg Curl Machine", sets: 4, reps: 10, type: "weight" },
        { id: "thu-hip-abduction", name: "Hip Abduction Machine", sets: 3, reps: 12, type: "weight" },
        { id: "thu-seated-calf-raise", name: "Seated Calf Raise", sets: 3, reps: 15, type: "weight" },
        { id: "thu-dead-bug", name: "Dead Bug", sets: 3, reps: 12, type: "weight" },
        { id: "thu-negative-pull-ups", name: "Negative Pull Ups", sets: 4, reps: 10, type: "weight" }
      ]
    }
  };
  var DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday"];
  var STORAGE_KEY = "gymlog.sessions.v1";

  // ---------- storage ----------
  var memoryFallback = {};
  var storageOK = true;
  try {
    var t = "__t__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
  } catch (e) {
    storageOK = false;
  }

  function loadData() {
    if (!storageOK) return memoryFallback;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function saveData(data) {
    if (!storageOK) { memoryFallback = data; return; }
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* storage full or blocked; data stays in memory for this session */ }
  }
  var DATA = loadData();

  // ---------- date helpers ----------
  function todayISO() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function formatShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function todayWeekdayName() {
    return new Date().toLocaleDateString("en-US", { weekday: "long" });
  }

  // ---------- exercise lookup ----------
  var EXERCISE_INDEX = {};
  DAYS.forEach(function (d) {
    ROUTINE[d].exercises.forEach(function (ex) {
      EXERCISE_INDEX[ex.id] = ex;
    });
  });

  function getSessions(exId) {
    var list = DATA[exId] || [];
    return list.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function bestMetric(session, type) {
    if (type === "time") {
      var mx = 0;
      session.sets.forEach(function (s) { if (s.reps != null && s.reps > mx) mx = s.reps; });
      return mx;
    }
    var mx2 = 0;
    session.sets.forEach(function (s) { if (s.weight != null && s.weight > mx2) mx2 = s.weight; });
    return mx2;
  }

  // ---------- state ----------
  var state = {
    day: DAYS.indexOf(todayWeekdayName()) !== -1 ? todayWeekdayName() : "Monday",
    openExId: null,
    view: "log"
  };

  // ---------- render: header ----------
  var todayLabelEl = document.getElementById("todayLabel");
  todayLabelEl.textContent = new Date().toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

  var dayTabsEl = document.getElementById("dayTabs");
  DAYS.forEach(function (d) {
    var btn = document.createElement("button");
    btn.className = "day-tab" + (d === state.day ? " active" : "");
    btn.textContent = d.slice(0, 3);
    btn.addEventListener("click", function () {
      state.day = d;
      renderDayTabs();
      renderDaySubtitle();
      renderExerciseList();
    });
    btn.dataset.day = d;
    dayTabsEl.appendChild(btn);
  });
  function renderDayTabs() {
    Array.prototype.forEach.call(dayTabsEl.children, function (btn) {
      btn.classList.toggle("active", btn.dataset.day === state.day);
    });
  }

  var daySubtitleEl = document.getElementById("daySubtitle");
  function renderDaySubtitle() {
    daySubtitleEl.textContent = ROUTINE[state.day].subtitle;
  }

  var primaryNavEl = document.getElementById("primaryNav");
  var coachViewEl = document.getElementById("coachView");
  var calendarViewEl = document.getElementById("calendarView");
  Array.prototype.forEach.call(primaryNavEl.children, function (btn) {
    btn.addEventListener("click", function () {
      state.view = btn.dataset.view;
      Array.prototype.forEach.call(primaryNavEl.children, function (b) {
        b.classList.toggle("active", b.dataset.view === state.view);
      });
      updateViewVisibility();
    });
  });
  function updateViewVisibility() {
    var isLog = state.view === "log";
    var isCoach = state.view === "coach";
    var isCalendar = state.view === "calendar";
    dayTabsEl.style.display = isLog ? "" : "none";
    daySubtitleEl.style.display = isLog ? "" : "none";
    document.getElementById("workoutProgress").style.display = isLog ? "" : "none";
    listEl.style.display = isLog ? "" : "none";
    coachViewEl.style.display = isCoach ? "" : "none";
    calendarViewEl.style.display = isCalendar ? "" : "none";
    if (isCoach) renderCoach();
    if (isCalendar) renderWorkoutCalendar();
  }

  // ---------- render: exercise list ----------
  var listEl = document.getElementById("exerciseList");
  var workoutProgressLabel = document.getElementById("workoutProgressLabel");
  var workoutProgressTrack = document.getElementById("workoutProgressTrack");
  var workoutProgressFill = document.getElementById("workoutProgressFill");
  function targetLabel(ex) {
    if (ex.type === "time") return ex.sets + " rounds × " + ex.reps + "s";
    return ex.sets + " × " + ex.reps;
  }
  function lastValueLabel(ex) {
    var sessions = getSessions(ex.id);
    if (!sessions.length) return { val: "—", lbl: "no data" };
    var last = sessions[sessions.length - 1];
    var m = bestMetric(last, ex.type);
    if (ex.type === "time") return { val: m ? m + "s" : "—", lbl: formatShort(last.date) };
    return { val: m ? m + " kg" : "—", lbl: formatShort(last.date) };
  }

  function drawSpark(canvas, points, type) {
    var dpr = window.devicePixelRatio || 1;
    var w = 64, h = 22;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    if (points.length < 2) return;
    var vals = points.map(function (p) { return p; });
    var min = Math.min.apply(null, vals);
    var max = Math.max.apply(null, vals);
    if (min === max) { min = min - 1; max = max + 1; }
    var pad = 3;
    var stepX = (w - pad * 2) / (vals.length - 1);
    function y(v) { return h - pad - ((v - min) / (max - min)) * (h - pad * 2); }
    var accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    ctx.beginPath();
    vals.forEach(function (v, i) {
      var x = pad + i * stepX;
      var yy = y(v);
      if (i === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    });
    ctx.strokeStyle = accent || "#cc8b3c";
    ctx.lineWidth = 1.6;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();
    var lastX = pad + (vals.length - 1) * stepX;
    var lastY = y(vals[vals.length - 1]);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 2.1, 0, Math.PI * 2);
    ctx.fillStyle = accent || "#cc8b3c";
    ctx.fill();
  }

  function renderExerciseList() {
    listEl.innerHTML = "";
    var exercises = ROUTINE[state.day].exercises;
    var loggedCount = exercises.filter(function (ex) { return todaysExistingSession(ex.id); }).length;
    workoutProgressLabel.textContent = loggedCount + " of " + exercises.length + " logged today";
    workoutProgressTrack.setAttribute("aria-valuemax", String(exercises.length));
    workoutProgressTrack.setAttribute("aria-valuenow", String(loggedCount));
    workoutProgressFill.style.width = (exercises.length ? loggedCount / exercises.length * 100 : 0) + "%";

    exercises.forEach(function (ex) {
      var card = document.createElement("button");
      card.className = "ex-card";
      card.type = "button";

      var main = document.createElement("div");
      main.className = "ex-main";
      var titleRow = document.createElement("div");
      titleRow.className = "ex-title-row";
      var name = document.createElement("p");
      name.className = "ex-name";
      name.textContent = ex.name;
      titleRow.appendChild(name);
      if (todaysExistingSession(ex.id)) {
        var logged = document.createElement("span");
        logged.className = "ex-logged";
        logged.textContent = "Logged today";
        titleRow.appendChild(logged);
      }
      var target = document.createElement("div");
      target.className = "ex-target";
      target.textContent = targetLabel(ex);
      main.appendChild(titleRow);
      main.appendChild(target);

      var stat = document.createElement("div");
      stat.className = "ex-stat";
      var info = lastValueLabel(ex);
      var valEl = document.createElement("span");
      valEl.className = "val";
      valEl.textContent = info.val;
      var lblEl = document.createElement("span");
      lblEl.className = "lbl";
      lblEl.textContent = info.lbl;
      stat.appendChild(valEl);
      stat.appendChild(lblEl);
      var sessions = getSessions(ex.id);
      if (sessions.length >= 2) {
        var canvas = document.createElement("canvas");
        canvas.className = "spark";
        stat.appendChild(canvas);
        requestAnimationFrame(function () {
          var pts = sessions.slice(-8).map(function (s) { return bestMetric(s, ex.type); });
          drawSpark(canvas, pts, ex.type);
        });
      }

      var chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.textContent = "›";

      card.appendChild(main);
      card.appendChild(stat);
      card.appendChild(chevron);
      card.addEventListener("click", function () { openDetail(ex.id); });
      listEl.appendChild(card);
    });
  }


  // ---------- detail sheet ----------
  var sheetEl = document.getElementById("sheet");
  var sheetName = document.getElementById("sheetName");
  var sheetTarget = document.getElementById("sheetTarget");
  var setTable = document.getElementById("setTable");
  var saveBtn = document.getElementById("saveBtn");
  var resetBtn = document.getElementById("resetBtn");
  var saveNote = document.getElementById("saveNote");
  var chartWrap = document.getElementById("chartWrap");
  var historyList = document.getElementById("historyList");
  var backBtn = document.getElementById("backBtn");
  var restTimerDisplay = document.getElementById("restTimerDisplay");
  var restTimerStatus = document.getElementById("restTimerStatus");
  var restTimerToggle = document.getElementById("restTimerToggle");
  var restTimerSet = document.getElementById("restTimerSet");
  var restTimerExercise = document.getElementById("restTimerExercise");
  var restTimerReset = document.getElementById("restTimerReset");
  var restDuration = 40;
  var restRemaining = restDuration;
  var restEndsAt = null;
  var restInterval = null;
  var restLabel = "Between sets";
  var progressDetails = document.getElementById("progressDetails");
  progressDetails.addEventListener("toggle", function () {
    if (progressDetails.open && state.openExId) {
      renderChart(EXERCISE_INDEX[state.openExId]);
    }
  });

  function openDetail(exId) {
    state.openExId = exId;
    var ex = EXERCISE_INDEX[exId];
    sheetName.textContent = ex.name;
    sheetTarget.textContent = targetLabel(ex);
    buildSetTable(ex);
    resetRestTimer();
    progressDetails.open = false;
    renderHistory(ex);
    saveNote.textContent = "";
    sheetEl.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeDetail() {
    sheetEl.classList.remove("open");
    document.body.style.overflow = "";
    state.openExId = null;
    stopRestTimer();
    resetRestTimer();
    renderExerciseList();
  }
  backBtn.addEventListener("click", closeDetail);

  function formatRestTime(seconds) {
    var minutes = Math.floor(seconds / 60);
    var remainder = String(seconds % 60).padStart(2, "0");
    return minutes + ":" + remainder;
  }
  function renderRestTimer(status) {
    restTimerDisplay.textContent = formatRestTime(restRemaining);
    restTimerToggle.textContent = restInterval ? "Pause" : (restRemaining > 0 && restRemaining < restDuration ? "Resume" : "Pause");
    restTimerToggle.disabled = !restInterval && (restRemaining === restDuration || restRemaining === 0);
    restTimerStatus.textContent = status || (restInterval ? restLabel : "Choose your rest");
  }
  function stopRestTimer() {
    if (restInterval) window.clearInterval(restInterval);
    restInterval = null;
    restEndsAt = null;
  }
  function resetRestTimer() {
    stopRestTimer();
    restRemaining = restDuration;
    renderRestTimer("Choose your rest");
  }
  function updateRestTimer() {
    restRemaining = Math.max(0, Math.ceil((restEndsAt - Date.now()) / 1000));
    if (restRemaining === 0) {
      stopRestTimer();
      renderRestTimer("Rest complete");
      return;
    }
    renderRestTimer();
  }
  function startRestTimer(duration, label) {
    stopRestTimer();
    restDuration = duration;
    restRemaining = duration;
    restLabel = label;
    restEndsAt = Date.now() + restRemaining * 1000;
    restInterval = window.setInterval(updateRestTimer, 250);
    renderRestTimer(label);
  }
  restTimerSet.addEventListener("click", function () {
    startRestTimer(40, "Between sets");
  });
  restTimerExercise.addEventListener("click", function () {
    startRestTimer(120, "Between exercises");
  });
  restTimerToggle.addEventListener("click", function () {
    if (restInterval) {
      updateRestTimer();
      if (!restInterval) return;
      stopRestTimer();
      renderRestTimer("Paused");
      return;
    }
    restEndsAt = Date.now() + restRemaining * 1000;
    restInterval = window.setInterval(updateRestTimer, 250);
    renderRestTimer(restLabel);
  });
  restTimerReset.addEventListener("click", resetRestTimer);

  function todaysExistingSession(exId) {
    var iso = todayISO();
    var list = DATA[exId] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].date === iso) return list[i];
    }
    return null;
  }
  function mostRecentSession(exId) {
    var sessions = getSessions(exId);
    return sessions.length ? sessions[sessions.length - 1] : null;
  }

  function buildSetTable(ex) {
    setTable.innerHTML = "";
    var existing = todaysExistingSession(ex.id);
    var prior = mostRecentSession(ex.id);

    if (ex.type === "time") {
      var head = document.createElement("div");
      head.className = "set-head time-row";
      head.innerHTML = "<span></span><span>Seconds held</span>";
      setTable.appendChild(head);
    } else {
      var head2 = document.createElement("div");
      head2.className = "set-head";
      head2.innerHTML = "<span></span><span>Weight (kg)</span><span>Reps</span>";
      setTable.appendChild(head2);
    }

    for (var i = 0; i < ex.sets; i++) {
      var row = document.createElement("div");
      row.className = "set-row" + (ex.type === "time" ? " time-row" : "");
      var num = document.createElement("span");
      num.className = "set-num";
      num.textContent = i + 1;
      row.appendChild(num);

      var existingSet = existing && existing.sets[i] ? existing.sets[i] : null;
      var priorSet = prior && prior.sets[i] ? prior.sets[i] : null;

      if (ex.type === "time") {
        var secInput = document.createElement("input");
        secInput.type = "number";
        secInput.inputMode = "numeric";
        secInput.min = "0";
        secInput.placeholder = String(ex.reps);
        secInput.value = existingSet ? (existingSet.reps != null ? existingSet.reps : "") : "";
        secInput.dataset.role = "reps";
        row.appendChild(secInput);
      } else {
        var wInput = document.createElement("input");
        wInput.type = "number";
        wInput.inputMode = "decimal";
        wInput.step = "0.5";
        wInput.min = "0";
        var wDefault = existingSet ? existingSet.weight : (priorSet ? priorSet.weight : null);
        wInput.value = wDefault != null ? wDefault : "";
        wInput.placeholder = "0";
        wInput.dataset.role = "weight";
        row.appendChild(wInput);

        var rInput = document.createElement("input");
        rInput.type = "number";
        rInput.inputMode = "numeric";
        rInput.min = "0";
        var rDefault = existingSet ? existingSet.reps : ex.reps;
        rInput.value = rDefault != null ? rDefault : "";
        rInput.placeholder = String(ex.reps);
        rInput.dataset.role = "reps";
        row.appendChild(rInput);
      }
      setTable.appendChild(row);
    }
  }

  resetBtn.addEventListener("click", function () {
    var inputs = setTable.querySelectorAll("input");
    inputs.forEach(function (inp) { inp.value = ""; });
    saveNote.textContent = "";
  });

  saveBtn.addEventListener("click", function () {
    var ex = EXERCISE_INDEX[state.openExId];
    var rows = setTable.querySelectorAll(".set-row");
    var sets = [];
    rows.forEach(function (row) {
      if (ex.type === "time") {
        var repsInput = row.querySelector('[data-role="reps"]');
        var repsVal = repsInput.value === "" ? null : Number(repsInput.value);
        sets.push({ weight: null, reps: repsVal });
      } else {
        var wInput = row.querySelector('[data-role="weight"]');
        var rInput = row.querySelector('[data-role="reps"]');
        var wVal = wInput.value === "" ? null : Number(wInput.value);
        var rVal = rInput.value === "" ? null : Number(rInput.value);
        sets.push({ weight: wVal, reps: rVal });
      }
    });

    var iso = todayISO();
    var list = DATA[ex.id] || [];
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].date === iso) { idx = i; break; }
    }
    var entry = { date: iso, sets: sets };
    if (idx >= 0) list[idx] = entry; else list.push(entry);
    DATA[ex.id] = list;
    saveData(DATA);

    saveNote.textContent = "Saved for " + formatShort(iso) + ".";
    renderChart(ex);
    renderHistory(ex);
    renderExerciseList();
  });

  // ---------- chart ----------
  function renderChart(ex) {
    chartWrap.innerHTML = "";
    var sessions = getSessions(ex.id);
    var pts = sessions
      .map(function (s) { return { date: s.date, v: bestMetric(s, ex.type) }; })
      .filter(function (p) { return p.v > 0; });

    if (pts.length < 2) {
      var empty = document.createElement("div");
      empty.className = "chart-empty";
      empty.textContent = "Log a couple more sessions to see your progress line.";
      chartWrap.appendChild(empty);
      return;
    }

    var canvas = document.createElement("canvas");
    chartWrap.appendChild(canvas);
    var cssW = chartWrap.clientWidth - 16;
    var cssH = 170;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    var styles = getComputedStyle(document.documentElement);
    var accent = styles.getPropertyValue("--accent").trim() || "#cc8b3c";
    var gridColor = styles.getPropertyValue("--grid-line").trim() || "rgba(150,150,150,0.1)";
    var faint = styles.getPropertyValue("--text-faint").trim() || "#888";
    var dimText = styles.getPropertyValue("--text-dim").trim() || "#999";

    var padL = 34, padR = 10, padT = 16, padB = 22;
    var plotW = cssW - padL - padR;
    var plotH = cssH - padT - padB;

    var vals = pts.map(function (p) { return p.v; });
    var min = Math.min.apply(null, vals);
    var max = Math.max.apply(null, vals);
    if (min === max) { min = min - (min * 0.1 || 1); max = max + (max * 0.1 || 1); }
    var range = max - min;
    min -= range * 0.1;
    max += range * 0.1;
    range = max - min;

    function xAt(i) { return padL + (pts.length === 1 ? 0 : (i / (pts.length - 1)) * plotW); }
    function yAt(v) { return padT + plotH - ((v - min) / range) * plotH; }

    // grid
    var gridLines = 3;
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    ctx.font = "11px -apple-system, sans-serif";
    ctx.fillStyle = faint;
    ctx.textBaseline = "middle";
    for (var g = 0; g <= gridLines; g++) {
      var gv = min + (range * g) / gridLines;
      var gy = yAt(gv);
      ctx.beginPath();
      ctx.moveTo(padL, gy);
      ctx.lineTo(padL + plotW, gy);
      ctx.stroke();
      ctx.textAlign = "right";
      var label = Math.round(gv * 10) / 10;
      ctx.fillText(String(label), padL - 6, gy);
    }

    // area fill
    var grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
    var fillTop = styles.getPropertyValue("--fill-top").trim();
    var fillBottom = styles.getPropertyValue("--fill-bottom").trim();
    grad.addColorStop(0, fillTop || "rgba(204,139,60,0.25)");
    grad.addColorStop(1, fillBottom || "rgba(204,139,60,0)");
    ctx.beginPath();
    pts.forEach(function (p, i) {
      var x = xAt(i), y = yAt(p.v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.lineTo(xAt(pts.length - 1), padT + plotH);
    ctx.lineTo(xAt(0), padT + plotH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // line
    ctx.beginPath();
    pts.forEach(function (p, i) {
      var x = xAt(i), y = yAt(p.v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    // dots
    pts.forEach(function (p, i) {
      var x = xAt(i), y = yAt(p.v);
      ctx.beginPath();
      ctx.arc(x, y, i === pts.length - 1 ? 3.5 : 2, 0, Math.PI * 2);
      ctx.fillStyle = i === pts.length - 1 ? accent : "transparent";
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.4;
      ctx.fill();
      ctx.stroke();
    });

    // endpoint label
    var last = pts[pts.length - 1];
    var unit = ex.type === "time" ? "s" : " kg";
    ctx.fillStyle = accent;
    ctx.font = "700 12px -apple-system, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.fillText(last.v + unit, xAt(pts.length - 1) - 4, yAt(last.v) - 6);

    // x labels: first and last date
    ctx.fillStyle = dimText;
    ctx.font = "11px -apple-system, sans-serif";
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.fillText(formatShort(pts[0].date), padL, padT + plotH + 6);
    ctx.textAlign = "right";
    ctx.fillText(formatShort(pts[pts.length - 1].date), padL + plotW, padT + plotH + 6);
  }

  // ---------- history ----------
  function renderHistory(ex) {
    historyList.innerHTML = "";
    var sessions = getSessions(ex.id).slice().reverse();
    if (!sessions.length) {
      var hint = document.createElement("p");
      hint.className = "empty-hint";
      hint.textContent = "No sessions logged yet.";
      historyList.appendChild(hint);
      return;
    }
    sessions.forEach(function (s) {
      var row = document.createElement("div");
      row.className = "history-row";
      var date = document.createElement("span");
      date.className = "history-date";
      date.textContent = formatShort(s.date);
      var sets = document.createElement("span");
      sets.className = "history-sets";
      if (ex.type === "time") {
        sets.textContent = s.sets.map(function (st) { return (st.reps != null ? st.reps : "—") + "s"; }).join("  ");
      } else {
        sets.textContent = s.sets.map(function (st) {
          var w = st.weight != null ? st.weight : "—";
          var r = st.reps != null ? st.reps : "—";
          return w + "×" + r;
        }).join("  ");
      }
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "history-del";
      delBtn.textContent = "✕";
      delBtn.setAttribute("aria-label", "Delete this session");
      delBtn.addEventListener("click", function () {
        if (!confirm("Delete the session logged on " + formatShort(s.date) + "?")) return;
        DATA[ex.id] = (DATA[ex.id] || []).filter(function (item) { return item.date !== s.date; });
        saveData(DATA);
        renderChart(ex);
        renderHistory(ex);
        renderExerciseList();
        if (s.date === todayISO()) buildSetTable(ex);
      });

      row.appendChild(date);
      row.appendChild(sets);
      row.appendChild(delBtn);
      historyList.appendChild(row);
    });
  }

  // ---------- coach ----------
  function computeDayRecap() {
    var iso = todayISO();
    var allDates = [];
    Object.keys(EXERCISE_INDEX).forEach(function (exId) {
      getSessions(exId).forEach(function (s) { allDates.push(s.date); });
    });
    var targetDate = allDates.indexOf(iso) !== -1 ? iso : (allDates.length ? allDates.sort()[allDates.length - 1] : null);
    if (!targetDate) return null;

    var entries = [];
    Object.keys(EXERCISE_INDEX).forEach(function (exId) {
      var ex = EXERCISE_INDEX[exId];
      var sessions = getSessions(exId);
      var todayIdx = -1;
      for (var i = 0; i < sessions.length; i++) {
        if (sessions[i].date === targetDate) { todayIdx = i; break; }
      }
      if (todayIdx === -1) return;
      var session = sessions[todayIdx];
      var metric = bestMetric(session, ex.type);
      if (!metric) return;
      var priorSessions = sessions.slice(0, todayIdx);
      var status, priorMetric = null, priorBest = null;
      if (!priorSessions.length) {
        status = "first";
      } else {
        priorBest = Math.max.apply(null, priorSessions.map(function (s) { return bestMetric(s, ex.type); }));
        priorMetric = bestMetric(priorSessions[priorSessions.length - 1], ex.type);
        if (metric > priorBest) status = "pr";
        else if (metric > priorMetric) status = "up";
        else if (metric < priorMetric) status = "down";
        else status = "same";
      }
      var repsSeries = session.sets.map(function (s) { return s.reps; }).filter(function (r) { return r != null; });
      var fatigueMsg = null;
      if (repsSeries.length >= 2) {
        var first = repsSeries[0], last = repsSeries[repsSeries.length - 1];
        if (first > 0 && (first - last) >= Math.max(2, first * 0.25)) {
          fatigueMsg = "Reps dropped from " + first + " to " + last + " across your sets — possible fatigue, consider more rest between sets.";
        }
      }
      entries.push({ ex: ex, status: status, metric: metric, priorMetric: priorMetric, priorBest: priorBest, fatigueMsg: fatigueMsg });
    });

    var order = { pr: 0, down: 1, up: 2, same: 3, first: 4 };
    entries.sort(function (a, b) { return order[a.status] - order[b.status]; });
    return { date: targetDate, entries: entries };
  }

  function messageFor(entry) {
    var unit = entry.ex.type === "time" ? "s" : " kg";
    switch (entry.status) {
      case "first": return "Baseline logged: " + entry.metric + unit + ". Next session we'll see how you progress.";
      case "pr": return "New best: " + entry.metric + unit + " — previous top was " + entry.priorBest + unit + ".";
      case "up": return "Up to " + entry.metric + unit + " from " + entry.priorMetric + unit + " last time. Trending the right way.";
      case "down": return "Down to " + entry.metric + unit + " from " + entry.priorMetric + unit + " last time — could be fatigue, a lighter day, or recovery catching up.";
      case "same": return "Matched last time at " + entry.metric + unit + ". Steady — consider a small jump next session.";
    }
    return "";
  }

  function shiftISODate(iso, days) {
    var date = new Date(iso + "T00:00:00");
    date.setDate(date.getDate() + days);
    return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
  }
  function getWeeklyPeriod() {
    var end = todayISO();
    var dayOffset = (new Date().getDay() + 6) % 7;
    var start = shiftISODate(end, -dayOffset);
    return {
      start: start,
      end: end,
      previousStart: shiftISODate(start, -7),
      previousEnd: shiftISODate(end, -7)
    };
  }
  function weeklySessions(exerciseId, start, end) {
    return getSessions(exerciseId).filter(function (session) {
      return session.date >= start && session.date <= end && bestMetric(session, EXERCISE_INDEX[exerciseId].type) > 0;
    });
  }
  function summarizeWeek(start, end) {
    var dates = {};
    var exerciseCount = 0;
    var volume = 0;
    Object.keys(EXERCISE_INDEX).forEach(function (exId) {
      var ex = EXERCISE_INDEX[exId];
      weeklySessions(exId, start, end).forEach(function (session) {
        dates[session.date] = true;
        exerciseCount++;
        if (ex.type !== "time") {
          session.sets.forEach(function (set) {
            if (set.weight > 0 && set.reps > 0) volume += set.weight * set.reps;
          });
        }
      });
    });
    return { trainingDays: Object.keys(dates).length, exerciseCount: exerciseCount, volume: volume };
  }
  var calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  var calendarSelectedDate = todayISO();

  function calendarSessionsByDate() {
    var byDate = {};
    Object.keys(EXERCISE_INDEX).forEach(function (exId) {
      getSessions(exId).forEach(function (session) {
        if (!byDate[session.date]) byDate[session.date] = [];
        byDate[session.date].push({ ex: EXERCISE_INDEX[exId], session: session });
      });
    });
    return byDate;
  }
  function renderWorkoutCalendar() {
    calendarViewEl.innerHTML = "";
    var byDate = calendarSessionsByDate();
    var year = calendarMonth.getFullYear();
    var month = calendarMonth.getMonth();
    var firstDay = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var firstDayOffset = (firstDay.getDay() + 6) % 7;
    var today = todayISO();
    var latestMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    var section = document.createElement("section");
    section.className = "workout-calendar";
    section.setAttribute("aria-label", "Workout completion calendar");

    var heading = document.createElement("div");
    heading.className = "calendar-heading";
    var title = document.createElement("h2");
    title.className = "calendar-title";
    title.textContent = calendarMonth.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    heading.appendChild(title);
    var nav = document.createElement("div");
    nav.className = "calendar-nav";
    var previous = document.createElement("button");
    previous.type = "button";
    previous.className = "calendar-nav-btn";
    previous.textContent = "‹";
    previous.setAttribute("aria-label", "Previous month");
    previous.addEventListener("click", function () {
      calendarMonth = new Date(year, month - 1, 1);
      selectCalendarMonthDay(byDate);
      renderWorkoutCalendar();
    });
    var next = document.createElement("button");
    next.type = "button";
    next.className = "calendar-nav-btn";
    next.textContent = "›";
    next.setAttribute("aria-label", "Next month");
    next.disabled = year === latestMonth.getFullYear() && month >= latestMonth.getMonth();
    next.addEventListener("click", function () {
      if (next.disabled) return;
      calendarMonth = new Date(year, month + 1, 1);
      selectCalendarMonthDay(byDate);
      renderWorkoutCalendar();
    });
    nav.appendChild(previous);
    nav.appendChild(next);
    heading.appendChild(nav);
    section.appendChild(heading);

    var grid = document.createElement("div");
    grid.className = "calendar-grid";
    grid.setAttribute("role", "grid");
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (day) {
      var weekday = document.createElement("div");
      weekday.className = "calendar-weekday";
      weekday.setAttribute("role", "columnheader");
      weekday.textContent = day;
      grid.appendChild(weekday);
    });

    for (var blank = 0; blank < firstDayOffset; blank++) {
      var emptyCell = document.createElement("span");
      emptyCell.setAttribute("role", "presentation");
      grid.appendChild(emptyCell);
    }
    for (var dayNumber = 1; dayNumber <= daysInMonth; dayNumber++) {
      var dateISO = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(dayNumber).padStart(2, "0");
      var dateButton = document.createElement("button");
      dateButton.type = "button";
      dateButton.className = "calendar-day";
      dateButton.textContent = String(dayNumber);
      dateButton.setAttribute("role", "gridcell");
      var sessionsForDay = byDate[dateISO] || [];
      var dayIsFuture = dateISO > today;
      dateButton.disabled = dayIsFuture;
      dateButton.setAttribute("aria-label", formatShort(dateISO) + (sessionsForDay.length ? ", " + sessionsForDay.length + (sessionsForDay.length === 1 ? " exercise logged" : " exercises logged") : ", no workout logged"));
      if (sessionsForDay.length) dateButton.classList.add("has-workout");
      if (dateISO === today) dateButton.classList.add("today");
      if (dateISO === calendarSelectedDate) {
        dateButton.classList.add("selected");
        dateButton.setAttribute("aria-selected", "true");
      }
      dateButton.addEventListener("click", function (selectedISO) {
        return function () {
          calendarSelectedDate = selectedISO;
          renderWorkoutCalendar();
        };
      }(dateISO));
      grid.appendChild(dateButton);
    }
    section.appendChild(grid);

    var legend = document.createElement("div");
    legend.className = "calendar-legend";
    legend.textContent = "● Workout logged";
    section.appendChild(legend);

    var selectedHeading = document.createElement("h3");
    selectedHeading.textContent = formatShort(calendarSelectedDate);
    var selectedSessions = byDate[calendarSelectedDate] || [];
    var daySummary = document.createElement("div");
    daySummary.className = "calendar-day-summary";
    daySummary.appendChild(selectedHeading);
    if (selectedSessions.length) {
      selectedSessions.forEach(function (item) {
        var row = document.createElement("div");
        row.className = "calendar-session";
        var name = document.createElement("span");
        name.textContent = item.ex.name;
        var detail = document.createElement("span");
        detail.className = "calendar-session-detail";
        var best = bestMetric(item.session, item.ex.type);
        var unit = item.ex.type === "time" ? "s" : " kg";
        detail.textContent = best > 0 ? "Best " + best + unit : item.session.sets.length + " sets";
        row.appendChild(name);
        row.appendChild(detail);
        daySummary.appendChild(row);
      });
    } else {
      var noSession = document.createElement("div");
      noSession.className = "calendar-legend";
      noSession.textContent = "No workouts logged on this day.";
      daySummary.appendChild(noSession);
    }
    section.appendChild(daySummary);
    calendarViewEl.appendChild(section);
  }
  function selectCalendarMonthDay(byDate) {
    var yearMonth = calendarMonth.getFullYear() + "-" + String(calendarMonth.getMonth() + 1).padStart(2, "0");
    var dates = Object.keys(byDate).filter(function (date) {
      return date.slice(0, 7) === yearMonth && date <= todayISO();
    }).sort();
    calendarSelectedDate = dates.length
      ? dates[dates.length - 1]
      : yearMonth + "-01";
  }

  function renderWeeklyReport() {
    var period = getWeeklyPeriod();
    var current = summarizeWeek(period.start, period.end);
    var previous = summarizeWeek(period.previousStart, period.previousEnd);
    var todayIsFriday = new Date().getDay() === 5;
    var section = document.createElement("section");
    section.className = "weekly-report";

    var heading = document.createElement("h2");
    heading.className = "weekly-report-title";
    heading.textContent = todayIsFriday ? "Friday weekly overview" : "This week's progress";
    section.appendChild(heading);

    var note = document.createElement("p");
    note.className = "weekly-report-note";
    note.textContent = formatShort(period.start) + "–" + formatShort(period.end) +
      " · Compared with the same days last week (" + formatShort(period.previousStart) + "–" + formatShort(period.previousEnd) + ")" +
      ". Calculated on this device from your saved logs; no AI or data sharing.";
    section.appendChild(note);

    var summary = document.createElement("div");
    summary.className = "weekly-report-summary";
    function appendChip(value, label) {
      var chipEl = document.createElement("div");
      chipEl.className = "summary-chip";
      var number = document.createElement("span");
      number.className = "num";
      number.textContent = value;
      var caption = document.createElement("span");
      caption.className = "lbl";
      caption.textContent = label;
      chipEl.appendChild(number);
      chipEl.appendChild(caption);
      summary.appendChild(chipEl);
    }
    appendChip(current.trainingDays + " / " + previous.trainingDays, "Days · now / prev");
    appendChip(current.exerciseCount + " / " + previous.exerciseCount, "Exercises · now / prev");
    var currentVolume = current.volume ? Math.round(current.volume).toLocaleString("en-US") : "0";
    var previousVolume = previous.volume ? Math.round(previous.volume).toLocaleString("en-US") : "0";
    appendChip(currentVolume + " / " + previousVolume, "Volume · now / prev");
    section.appendChild(summary);

    var insight = document.createElement("div");
    insight.className = "weekly-insight";
    if (!current.trainingDays) {
      insight.textContent = previous.trainingDays
        ? "No workouts logged in this week's period yet. In the same period last week, you trained on " + previous.trainingDays + " " + (previous.trainingDays === 1 ? "day" : "days") + " and logged " + previous.exerciseCount + " " + (previous.exerciseCount === 1 ? "exercise" : "exercises") + "."
        : "No workouts logged in this week's period yet. Log a session to start your week-to-week comparison.";
      section.appendChild(insight);
      coachViewEl.appendChild(section);
      return;
    }
    var workoutChange = current.trainingDays - previous.trainingDays;
    var exerciseChange = current.exerciseCount - previous.exerciseCount;
    var activityText = workoutChange === 0
      ? "You trained on the same number of days as the comparison week"
      : "You trained on " + Math.abs(workoutChange) + " " + (Math.abs(workoutChange) === 1 ? "day" : "days") + (workoutChange > 0 ? " more" : " fewer") + " than the comparison week";
    activityText += exerciseChange === 0
      ? " and logged the same number of exercises."
      : " and logged " + Math.abs(exerciseChange) + " " + (Math.abs(exerciseChange) === 1 ? "exercise" : "exercises") + (exerciseChange > 0 ? " more." : " fewer.");
    if (current.volume > 0 || previous.volume > 0) {
      var volumeChange = current.volume - previous.volume;
      activityText += " Logged weight-volume is " + (volumeChange === 0 ? "unchanged" : Math.round(Math.abs(volumeChange)).toLocaleString("en-US") + " kg × reps " + (volumeChange > 0 ? "higher" : "lower")) + " than the comparison week.";
    } else {
      activityText += " No complete weighted sets were logged in these periods, so volume could not be compared.";
    }
    insight.textContent = activityText;
    section.appendChild(insight);

    var exerciseCards = document.createElement("div");
    exerciseCards.className = "weekly-exercises";
    var comparedCount = 0;
    Object.keys(EXERCISE_INDEX).forEach(function (exId) {
      var ex = EXERCISE_INDEX[exId];
      var thisWeek = weeklySessions(exId, period.start, period.end);
      if (!thisWeek.length) return;
      var lastWeek = weeklySessions(exId, period.previousStart, period.previousEnd);
      var currentBest = Math.max.apply(null, thisWeek.map(function (session) { return bestMetric(session, ex.type); }));
      var previousBest = lastWeek.length ? Math.max.apply(null, lastWeek.map(function (session) { return bestMetric(session, ex.type); })) : null;
      var status = previousBest === null ? "first" : (currentBest > previousBest ? "up" : (currentBest < previousBest ? "down" : "same"));
      var unit = ex.type === "time" ? "s" : " kg";
      var difference = previousBest === null ? null : currentBest - previousBest;

      var card = document.createElement("div");
      card.className = "weekly-exercise";
      var top = document.createElement("div");
      top.className = "coach-card-top";
      var name = document.createElement("span");
      name.className = "coach-ex-name";
      name.textContent = ex.name;
      var pill = document.createElement("span");
      pill.className = "pill " + status;
      pill.textContent = { up: "Up", down: "Down", same: "Steady", first: "No comparison" }[status];
      top.appendChild(name);
      top.appendChild(pill);
      card.appendChild(top);

      var message = document.createElement("div");
      message.className = "coach-msg";
      if (previousBest === null) {
        message.textContent = "Best this week: " + currentBest + unit + ". No session for comparison last week.";
      } else {
        var changeText = difference === 0 ? "unchanged" : Math.abs(difference) + unit + (difference > 0 ? " higher" : " lower");
        message.textContent = "Best this week: " + currentBest + unit + " vs " + previousBest + unit + " last week (" + changeText + ").";
      }
      card.appendChild(message);
      exerciseCards.appendChild(card);
      comparedCount++;
    });
    if (comparedCount) {
      section.appendChild(exerciseCards);
    } else {
      var empty = document.createElement("p");
      empty.className = "weekly-report-note";
      empty.textContent = "No workouts logged this week yet. Your overview will appear here after you log a session.";
      section.appendChild(empty);
    }
    coachViewEl.appendChild(section);
  }

  function renderCoach() {
    coachViewEl.innerHTML = "";
    renderWeeklyReport();
    var recap = computeDayRecap();

    if (recap && recap.entries.length) {
      var dateLabel = document.createElement("div");
      dateLabel.className = "coach-date";
      dateLabel.textContent = (recap.date === todayISO() ? "Today · " : "Most recent session · ") + formatShort(recap.date);
      coachViewEl.appendChild(dateLabel);

      var counts = { pr: 0, up: 0, down: 0, same: 0, first: 0 };
      recap.entries.forEach(function (e) { counts[e.status]++; });

      var summary = document.createElement("div");
      summary.className = "coach-summary";
      function chip(num, lbl) {
        var c = document.createElement("div");

        n.textContent = num;
        var l = document.createElement("span");

      summary.appendChild(chip(counts.pr, "PRs"));

      coachViewEl.appendChild(summary);

      recap.entries.forEach(function (entry) {
        var card = document.createElement("div");

        name.textContent = entry.ex.name;
        var pill = document.createElement("span");

        top.appendChild(name);
        top.appendChild(pill);

        var msg = document.createElement("div");

        coachViewEl.appendChild(card);
      });

      var empty = document.createElement("div");
      empty.className = "coach-empty";
      empty.textContent = "Log a workout to see your recap and progress notes here.";
      coachViewEl.appendChild(empty);
    }

    coachViewEl.appendChild(buildBackupBox());
  }

  // ---------- backup / restore ----------
  function buildBackupBox() {
    var box = document.createElement("div");
    box.className = "backup-box";

    var label = document.createElement("p");
    label.className = "section-label";
    label.textContent = "Backup your data";
    box.appendChild(label);

    var note = document.createElement("p");
    note.className = "backup-note";
    note.textContent = "This copies every set you've ever logged as text. Save it in Notes so you can restore it if this device ever clears its storage.";
    box.appendChild(note);

    var area = document.createElement("textarea");
    area.readOnly = true;
    area.value = JSON.stringify(DATA);
    box.appendChild(area);

    var row = document.createElement("div");
    row.className = "backup-row";
    var copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "backup-btn";
    copyBtn.textContent = "Copy backup";
    copyBtn.addEventListener("click", function () {
      area.value = JSON.stringify(DATA);
      area.focus();
      area.select();
      var done = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(area.value).then(function () {
          copyBtn.textContent = "Copied!";
          setTimeout(function () { copyBtn.textContent = "Copy backup"; }, 1500);
        }).catch(function () { fallbackCopy(); });
        done = true;
      }
      if (!done) fallbackCopy();
      function fallbackCopy() {
        try {
          document.execCommand("copy");
          copyBtn.textContent = "Copied!";
        } catch (e) {
          copyBtn.textContent = "Select the text above";
        }
        setTimeout(function () { copyBtn.textContent = "Copy backup"; }, 1500);
      }
    });
    row.appendChild(copyBtn);
    box.appendChild(row);

    var restoreLabel = document.createElement("p");
    restoreLabel.className = "section-label";
    restoreLabel.style.marginTop = "6px";
    restoreLabel.textContent = "Restore from backup";
    box.appendChild(restoreLabel);

    var restoreArea = document.createElement("textarea");
    restoreArea.placeholder = "Paste a previously copied backup here";
    box.appendChild(restoreArea);

    var restoreRow = document.createElement("div");
    restoreRow.className = "backup-row";
    var restoreBtn = document.createElement("button");
    restoreBtn.type = "button";
    restoreBtn.className = "backup-btn";
    restoreBtn.textContent = "Restore this backup";
    var restoreNote = document.createElement("p");
    restoreNote.className = "backup-note";
    restoreBtn.addEventListener("click", function () {
      try {
        var parsed = JSON.parse(restoreArea.value);
        if (!parsed || typeof parsed !== "object") throw new Error("bad shape");
        DATA = parsed;
        saveData(DATA);
        restoreNote.textContent = "Restored. Your history below is now updated.";
        renderExerciseList();
        renderCoach();
      } catch (e) {
        restoreNote.textContent = "That didn't look like a valid backup — make sure you pasted the whole thing.";
      }
    });
    restoreRow.appendChild(restoreBtn);
    box.appendChild(restoreRow);
    box.appendChild(restoreNote);

    return box;
  }

  // ---------- init ----------
  renderDayTabs();
  renderDaySubtitle();
  renderExerciseList();
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (reg) { reg.unregister(); });
    });
  }
  if (window.caches) {
    caches.keys().then(function (keys) {
      keys.forEach(function (k) { caches.delete(k); });
    });
  }

  // Auto-update: always check the real deployed version (bypassing HTTP cache)
  // and force a fresh reload if this page is stale, so future fixes arrive
  // without needing to manually clear site data every time.
  var APP_VERSION = "2026-10-14-16";
  fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.v && data.v !== APP_VERSION) {
        var url = new URL(location.href);
        url.searchParams.set("_r", Date.now());
        location.replace(url.toString());
      }
    })
    .catch(function () {});
</script>
